# Hexplate: the native SwiftUI iPhone app. Generate the Xcode project with `xcodegen` in this
# folder; the generated Hexplate.xcodeproj is not committed.
name: Hexplate
options:
  # Traditional Chinese by default; the phone app can switch to English (en.lproj, Settings → Units & language).
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  HexplateCore:
    path: HexplateCore
targets:
  Hexplate:
    type: application
    platform: iOS
    sources:
      - Hexplate
      # The Live Activity's types and buttons, shared with the widget extension.
      - Widgets/WorkoutActivity.swift
      - Widgets/Group.swift
      # Licensed 180 px exercise media from the openGym checkout (its catalogue/media/NOTICE.md),
      # not in this repo: link it locally (`ln -s <openGym checkout>/catalogue catalogue`, git-ignored).
      # ponytail: optional, so the app builds without it and shows no media.
      - path: ../catalogue/media/still
        type: folder
        buildPhase: resources
        optional: true
      - path: ../catalogue/media/clip
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: HexplateCore
      - target: HexplateWatch
      - target: HexplateWidgets
    settings:
      base:
        # Same id as the Capacitor app on purpose: Hexplate installs over it.
        PRODUCT_BUNDLE_IDENTIFIER: com.rippuhonwan.mygym
        SWIFT_VERSION: "6.0"
        # Explicit pins of current effective Swift 6 concurrency defaults so future Xcode upgrades
        # cannot silently flip nonisolated async execution onto @MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_APPROACHABLE_CONCURRENCY: NO
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hexplate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHealthShareUsageDescription: Hexplate reads your body weight from Apple Health when you import it.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Hexplate writes your weigh-ins and finished workouts to Apple Health.
        # Settings → Look & Home → App icon: recoloured copies of the icon (Assets.xcassets).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Light AppIcon-Mono AppIcon-Blue AppIcon-Orange AppIcon-Pink AppIcon-Purple"
        # Settings → Reminders → Gym reminder: the phone watches your gyms and nudges you there.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Hexplate uses your location to save where your gym is.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Hexplate reminds you to start your workout when you arrive at your gym, even when the app is closed.
    entitlements:
      path: Hexplate/Hexplate.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.rippuhonwan.mygym]
    # The links the widgets open (opengym://…, the Capacitor app's scheme, kept so widgets
    # already on a Home Screen keep working).
    info:
      path: Hexplate/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.rippuhonwan.mygym
            CFBundleURLSchemes: [opengym]
        NSSupportsLiveActivities: true
        # The paired openGym server may be plain http:// on the home network, as in the old app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Used to reach your own openGym server on your home network, when you connect one.

  # The Apple Watch app, moved from frontend/ios/App/Watch (copied, same bundle id). WatchCore's
  # sources compile into it, as they did there.
  HexplateWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - WatchCore/Sources/WatchCore
    dependencies:
      - target: HexplateWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Hexplate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rippuhonwan.mygym
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        # The complications' links (opengym-watch://start, open).
        CFBundleURLTypes:
          - CFBundleURLName: com.rippuhonwan.mygym.watchkitapp
            CFBundleURLSchemes: [opengym-watch]
        NSHealthShareUsageDescription: Hexplate shows your heart rate during a workout and next to each set.
        NSHealthUpdateUsageDescription: Hexplate saves your workouts to Apple Health.
    entitlements:
      path: Watch/HexplateWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shared with the complications (WidgetState).
        com.apple.security.application-groups: [group.com.rippuhonwan.mygym]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rippuhonwan.mygym.watchkitapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ponytail: defensive/unproven — keep Watch debug bundles monolithic (no split .debug.dylib stub) for untethered installs.
        ENABLE_DEBUG_DYLIB: NO

  # The Home Screen and Lock Screen widgets, moved from frontend/ios/App/OpenGymWidgets (same
  # bundle id, so widgets already placed stay), and the workout's Live Activity.
  HexplateWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hexplate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HexplateWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rippuhonwan.mygym]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rippuhonwan.mygym.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # The watch's complications and Smart Stack widget, moved from frontend/ios/App/WatchWidgets.
  # They show what the watch app writes (Watch/WidgetState.swift) to the App Group.
  HexplateWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - WatchWidgets
      - Watch/WidgetState.swift
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hexplate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidgets/HexplateWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rippuhonwan.mygym]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rippuhonwan.mygym.watchkitapp.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        # ponytail: defensive/unproven — match HexplateWatch monolithic binary layout.
        ENABLE_DEBUG_DYLIB: NO

schemes:
  Hexplate:
    build:
      targets:
        Hexplate: all
  HexplateWatch:
    build:
      targets:
        HexplateWatch: all
